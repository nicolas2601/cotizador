name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    name: Backend Lint & Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 \
            libffi-dev libcairo2

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Django check
        run: uv run python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.base
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: sqlite:///db.sqlite3
          DJANGO_ALLOWED_HOSTS: "*"
          DJANGO_DEBUG: "True"

      - name: Check migrations
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.base
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: sqlite:///db.sqlite3
          DJANGO_DEBUG: "True"

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-build]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t cotizador-backend ./backend

      - name: Build frontend image
        run: docker build -t cotizador-frontend ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
